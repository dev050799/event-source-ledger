server:
  port: 8080

spring:
  application:
    name: event-sourced-ledger
  datasource:
    url: jdbc:postgresql://localhost:5432/ledger
    username: postgres
    password: root
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time-zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    org.hibernate.sql: info
